<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>技術士 答え入力</title>
<meta name="theme-color" content="#2F5D62">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --ground:#F4F6F3; --surface:#FFFFFF; --ink:#1E2421; --muted:#5E6963; --line:#D3D9D3;
  --accent:#2F5D62; --accent-ink:#FFFFFF; --accent-soft:#E2ECEC; --flag:#9A6414; --flag-soft:#F6ECDC;
  --font:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141816; --surface:#1D2320; --ink:#E4E9E5; --muted:#9AA59F; --line:#333C37;
    --accent:#86B8BD; --accent-ink:#10201F; --accent-soft:#233334; --flag:#E0B062; --flag-soft:#3A2F1C;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  padding:env(safe-area-inset-top,0px) 16px 0}
.wrap{max-width:440px;margin:0 auto;padding-block:12px 120px;display:flex;flex-direction:column;gap:14px}
.banner{font-size:12px;color:var(--flag);background:var(--flag-soft);border-radius:6px;padding:6px 10px}
header{display:flex;flex-direction:column;gap:2px}
header .date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
header h1{font-size:20px;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.times{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
.times label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.times input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row{display:grid;grid-template-columns:3.2em 1fr;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.qn{font-weight:700}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;cursor:pointer;display:grid;place-items:center;padding:0}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.extra{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12.5px;padding:3px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--ink);background:var(--accent-soft);border-color:var(--accent)}
.chip.flag[aria-pressed="true"]{color:var(--flag);background:var(--flag-soft);border-color:var(--flag)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 18px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:9px 14px;border-radius:10px;cursor:pointer}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:12px 22px;border-radius:10px;cursor:pointer}
.primary:disabled{opacity:.45;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:440px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
details summary{cursor:pointer;font-weight:700}
.days{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.days button{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:8px 2px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.days li:first-child button{border-top:0}
.days .st{color:var(--muted);font-size:13px;white-space:nowrap}
.days button[aria-current="true"]{font-weight:700}
.foot{font-size:12px;color:var(--muted);text-align:center;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.foot button{border:0;background:none;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.gate{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;padding:16px;z-index:10}
.gate .card{max-width:360px;width:100%;align-items:center;text-align:center}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:.92}
.drill{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.drill .dhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.drill h2{margin:0;font-size:16px}
.drill .round{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:6px}
.drill .round.locked{opacity:.7}
.drill .rtitle{font-size:13px;color:var(--muted);margin:2px 0}
.drow{display:grid;grid-template-columns:2.4em minmax(0,1fr) 1.6em;align-items:center;gap:8px;padding:6px 0}
.drow .mark{font-weight:700;font-size:18px;text-align:center}
.drow.x .mark{color:var(--flag)}
.fmt{flex-basis:100%;font-size:12px;color:var(--muted);margin:0}
.txt{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.drill .dfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drill .msg{font-size:13px;color:var(--flag);margin:0}
.fmt.reveal{color:var(--ink);font-weight:700}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="card">
    <h2>技術士 答え入力</h2>
    <p>Google アカウントでログインすると、その日の紙の答えを入れられます。</p>
    <button class="primary" id="loginBtn">ログイン</button>
    <p id="authMsg"></p>
  </div>
</div>

<div class="wrap">
  <div class="banner" id="demoBanner" hidden>見本モードです。押した内容はどこにも保存されません。</div>

  <section id="empty" hidden>
    <div class="card">
      <h2>まだ紙が届いていません</h2>
      <p>技術士の日の前の晩（21:00）に、HANDY が紙といっしょにここへ届けます。</p>
    </div>
  </section>

  <section id="main" hidden>
    <header>
      <span class="date" id="hDate"></span>
      <h1 id="hTitle"></h1>
    </header>

    <section class="drill" id="drillBox" hidden>
      <div class="dhead"><h2 id="drillTitle">式ドリル</h2><button class="chip" id="drillHide" hidden>○×を出さない</button></div>
      <p class="hint" id="drillHint"></p>
      <div id="drillRounds"></div>
    </section>

    <div id="entry">
      <p class="hint">紙の「問1〜」の順に、選んだ番号を押す。</p>
      <div class="times"><label>開始<input type="time" id="tStart"></label><label id="tRedoBox" hidden>解き直し終了<input type="time" id="tRedo"></label><label>終了<input type="time" id="tEnd"></label></div>
      <p class="hint" style="margin-top:4px">紙に書いた時刻を入れる。終了は空のままなら送った時刻になる。</p>
      <div class="list" id="list" style="margin-top:8px"></div>
    </div>

    <div class="card" id="done" hidden>
      <h2>受け取りました</h2>
      <p id="doneMsg"></p>
      <div><button class="ghost" id="redoBtn">入れ直す</button></div>
    </div>
  </section>

  <details id="daysBox" hidden>
    <summary>ほかの日</summary>
    <ul class="days" id="days"></ul>
  </details>

  <div class="foot"><span id="acct"></span><button id="logoutBtn" hidden>ログアウト</button></div>
</div>

<div class="bar" id="bar" hidden>
  <div class="in">
    <span class="count" id="count"></span>
    <button class="primary" id="sendBtn" disabled>送る</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
/* 技術士一次の出題器・スマホの答え入力（設計の正本＝Vault 20_Projects/技術士試験/技術士試験対策.md「学習ツールの設計」）。
   方針：○×・点数・正答はこの画面のどこにも出さない。送ったあとは「受け取りました」だけ。
   データ（Firestore・プロジェクト gijutsushi-pwa）：
     users/{uid}/gj/{YYYY-MM-DD}    HANDY（gijutsushi/src/gj_sync.py）が date・label・n を置く。
                                   この画面が answers・unknown・flag・hint（すべて紙の問1〜の順）と submittedAt を足す。
     users/{uid}/gjkey/{日付}       正答（HANDY が置く）。この画面は読まない。判定はスクリプトが行う。
     users/{uid}/meta/gj            ログインの印。HANDY が uid を見つけるために使う。
   問題文・画像・正答はこのリポジトリ（公開）に入れない。 */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, setDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

/* Firebase設定（公開して安全な値＝秘密鍵ではない）。REPLACE_ME のままなら見本モードで動く */
const firebaseConfig = {
  apiKey: "AIzaSyDLlbavjNCsqlziUcPhojDBRaozNA_QSco",
  authDomain: "gijutsushi-pwa.firebaseapp.com",
  projectId: "gijutsushi-pwa",
  storageBucket: "gijutsushi-pwa.firebasestorage.app",
  messagingSenderId: "244803768578",
  appId: "1:244803768578:web:a3dd61516567d60a60721b"
};

const CIRC = ["①","②","③","④","⑤"];
const $ = id => document.getElementById(id);
const DEMO = firebaseConfig.apiKey === "REPLACE_ME" || new URLSearchParams(location.search).has("demo");

let db = null, auth = null, uid = null, unsub = null;
let sets = {};            // { 日付: ドキュメント }
let cur = null;           // 表示中の日付
let editing = false;      // 受け取り済みの日を入れ直しているか
let pinned = null;        // 本人が選んだ／入力を始めた日の論理日。その日のうちは勝手に切り替えない
let ans = [], unk = [], flg = [], hnt = [];
let tStart = "", tEnd = "";   // 開始・終了（HH:MM・紙の枠と同じ・2026-10-04）
let tRedo = "";               // 解き直し終了（紙の問1〜redo が解き直しの日だけ・2026-10-06）

/* ---------- 日付 ---------- */
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function logicalToday(){ const d = new Date(); if (d.getHours() < 5) d.setDate(d.getDate() - 1); return fmt(d); }
function parse(s){ const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
const dow = s => "日月火水木金土"[parse(s).getDay()];
const dateLabel = s => `${s}（${dow(s)}）`;
const shortLabel = s => `${Number(s.slice(5, 7))}/${Number(s.slice(8, 10))}（${dow(s)}）`;

function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1800); }
function el(tag, attrs = {}, text){ const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; }

/* ---------- 下書き（送る前に閉じても消えないように。この端末だけ） ---------- */
function saveDraft(){ pinned = logicalToday(); try { localStorage.setItem("gj-draft-" + cur, JSON.stringify({ ans, unk, flg, hnt, tStart, tEnd, tRedo })); } catch (e) {} }
function loadDraft(date, n){
  try {
    const d = JSON.parse(localStorage.getItem("gj-draft-" + date) || "null");
    if (d && d.ans && d.ans.length === n) return d;
  } catch (e) {}
  return null;
}
function dropDraft(date){ try { localStorage.removeItem("gj-draft-" + date); } catch (e) {} }

/* ---------- 式ドリル（2026-10-16〜・設計＝Vault 技術士試験対策 notes 2026-10-13） ----------
   紙の一番上の「D1〜」。HANDY が gj に drill＝{mode, minutes, n, qs:[{t, n, a?}]} を置く。
   instant＝送るとその場で ○×、× の項目だけ紙で直して全部 ○ まで送り直す（eigo-pwa の採点と同じ形）。
   hidden（または端末の「○×を出さない」）＝1回送るだけで ○× は出さない。本題の問は今までどおり ○× を出さない。
   送った記録＝drillRounds（[{qs:[D の添字], sel, ok}]）・drillDoneAt。1回目の ○× は HANDY が項目の答えと照らして決める。
   打ちかけは端末の下書きだけに置き、採点（送信）したときだけ保存する（打ちかけを1回目として読ませない）。
   判定は eigo-pwa の judge()／normShort() を写した（全角半角を NFKC で揃えるのだけ足した＝HANDY の drill.py と同じ） */
const normShort = v => { let x = String(v || "").normalize("NFKC").trim().toLowerCase().split(/\s+/).join(" "); if (x.endsWith(".")) x = x.slice(0, -1).trimEnd(); return x; };
function judge(q, v){
  if (q.t === "short") return (q.a || []).some(a => normShort(a) === normShort(v));
  return v === q.a;
}
/* 短答の答えの形（2026-10-19 本人「語入力だと分からなかった．回答の形式からちゃんと分かるようにして．」）。
   項目に f（"word"／"num"／"expr"）があればそれを使い、無ければ受け付ける答え a から決める：
   全部が数値なら数値、かな・漢字を含めば語、それ以外は記号・式。欄の上に常に見える字で出す（placeholder は打つと消えるため） */
const SHORT_FMT = {
  word: { label: "語を打つ（漢字・かな）", ph: "語を打つ" },
  num:  { label: "数値を打つ（半角・全角どちらでも）", ph: "数値を打つ" },
  expr: { label: "記号・式を打つ（英字・記号）", ph: "記号・式を打つ" },
};
function shortKind(spec){
  if (SHORT_FMT[spec.f]) return spec.f;
  const as = (spec.a || []).map(a => String(a).normalize("NFKC").trim()).filter(Boolean);
  if (as.length && as.every(a => /^[-+]?(\d+([.,]\d+)?|\.\d+)(\/\d+)?(e[-+]?\d+)?$/i.test(a))) return "num";
  if (as.some(a => /[぀-ヿ㐀-鿿]/.test(a))) return "word";
  return "expr";
}
const filled = v => v !== null && v !== undefined && String(v).trim() !== "";
/* 「思い出せない」（2026-10-21 本人決定）：推測で埋めずに押す。その項目は × として送られ（HANDY の判定でも ×＝翌日また出る）、
   instant の日はその場で答えを出して直しの回には回さない（紙に写して閉じる）。○× を出さない日は送るだけ */
const GIVEUP = "?思い出せない";
const answerText = spec => spec.t === "choice" ? (CIRC[spec.a - 1] || String(spec.a)) : (spec.a || [])[0];
let dst = null;           // 表示中の日のドリルの記録 { rounds, doneAt }
const hideKey = "gj-drill-hide";
function hideMarks(){ try { return localStorage.getItem(hideKey) === "1"; } catch (e) { return false; } }
function drillOf(s){ return s && s.drill && s.drill.n ? s.drill : null; }
const quiet = d => d.mode !== "instant" || hideMarks();          // ○× を出さない見せ方
function freshRound(qs){ return { qs, sel: qs.map(() => null), ok: qs.map(() => null) }; }
function loadDrill(date, s){
  const d = drillOf(s);
  if (!d) return null;
  try {
    const x = JSON.parse(localStorage.getItem("gj-drill-" + date) || "null");
    if (x && Array.isArray(x.rounds) && x.rounds.length) return x;
  } catch (e) {}
  if (Array.isArray(s.drillRounds) && s.drillRounds.length)
    return { rounds: s.drillRounds.map(r => ({ qs: r.qs.slice(), sel: (r.sel || []).slice(), ok: (r.ok || []).slice() })), doneAt: s.drillDoneAt || null };
  return { rounds: [freshRound([...Array(d.n).keys()])], doneAt: null };
}
function draftDrill(){ try { localStorage.setItem("gj-drill-" + cur, JSON.stringify(dst)); } catch (e) {} }
const graded = r => r.ok.length > 0 && r.ok.every(v => v !== null);
const lastRound = () => dst.rounds[dst.rounds.length - 1];

async function saveDrill(){
  const now = new Date().toISOString();
  const patch = { drillRounds: dst.rounds, drillDoneAt: dst.doneAt, updatedAt: now };
  sets[cur] = { ...sets[cur], ...patch };
  try { localStorage.removeItem("gj-drill-" + cur); } catch (e) {}
  if (DEMO || !uid) return;
  try { await setDoc(doc(db, "users", uid, "gj", cur), patch, { merge: true }); }
  catch (e) { if (e && e.code === "permission-denied") toast("保存できませんでした（権限）"); }
}

function gradeDrill(){
  const d = drillOf(sets[cur]), r = lastRound();
  const empty = r.qs.filter((q, i) => !filled(r.sel[i]));
  if (empty.length) { $("drillMsg").textContent = "まだ答えていない項目があります：" + empty.map(q => "D" + (q + 1)).join("・"); return; }
  if (quiet(d)) {                       // ○× を出さない：1回送って終わり（判定は HANDY）
    dst.doneAt = new Date().toISOString();
  } else {
    r.ok = r.qs.map((q, i) => r.sel[i] !== GIVEUP && judge(d.qs[q], r.sel[i]));
    const wrong = r.qs.filter((q, i) => r.ok[i] === false && r.sel[i] !== GIVEUP);   // 思い出せない項目は答えを見て閉じる
    if (wrong.length) dst.rounds.push(freshRound(wrong)); else dst.doneAt = new Date().toISOString();
  }
  pinned = logicalToday();
  saveDrill(); renderDrill();
}

function renderDrill(){
  const s = sets[cur], d = drillOf(s);
  $("drillBox").hidden = !d;
  if (!d) return;
  const q0 = quiet(d);
  $("drillTitle").textContent = `式ドリル（${d.n}項目${d.minutes ? "・" + d.minutes + "分" : ""}）`;
  $("drillHide").hidden = d.mode !== "instant";
  $("drillHide").setAttribute("aria-pressed", String(hideMarks()));
  $("drillHint").textContent = dst.doneAt
    ? (q0 ? "受け取りました。" : "全部 ○ になりました。")
    : (q0 ? "紙の D1〜 の答えを入れて送る（○× は出ません）。思い出せない項目は「思い出せない」を押す。"
          : "紙の D1〜 の答えを入れて採点する。× は紙で直して、全部 ○ まで送り直す。思い出せない項目は推測で埋めず「思い出せない」を押す（採点すると答えが出る・翌日また出る）。");
  const box = $("drillRounds");
  box.replaceChildren();
  dst.rounds.forEach((r, idx) => {
    const active = idx === dst.rounds.length - 1 && !dst.doneAt && !graded(r);
    const wrap = el("div", { class: "round" + (active ? "" : " locked") });
    if (dst.rounds.length > 1 || idx > 0) wrap.append(el("p", { class: "rtitle" }, idx === 0 ? "1回目" : `直し ${idx}回目（${r.qs.length}項目）`));
    r.qs.forEach((q, i) => {
      const spec = d.qs[q], row = el("div", { class: "drow" + (!q0 && r.ok[i] === false ? " x" : "") });
      const field = el("div", { class: "opts" });
      const gave = r.sel[i] === GIVEUP;
      if (spec.t === "choice") {
        for (let j = 1; j <= (spec.n || 4); j++) {
          const b = el("button", { class: "opt", type: "button", "aria-pressed": String(r.sel[i] === j), "aria-label": `D${q + 1} の ${j} 番` }, CIRC[j - 1] || String(j));
          if (!active) b.disabled = true;
          else b.onclick = () => { r.sel[i] = r.sel[i] === j ? null : j; pinned = logicalToday(); draftDrill(); renderDrill(); };
          field.append(b);
        }
      } else {
        const fmt = SHORT_FMT[shortKind(spec)];
        const inp = el("input", { class: "txt", type: "text", autocomplete: "off", autocapitalize: "off", placeholder: fmt.ph, "aria-label": `D${q + 1} の答え（${fmt.label}）` });
        field.append(el("p", { class: "fmt" }, fmt.label));
        inp.value = gave ? "" : (r.sel[i] || "");
        if (active) inp.addEventListener("input", e => { r.sel[i] = e.currentTarget.value; pinned = logicalToday(); draftDrill(); renderGiveup(); });
        else inp.disabled = true;
        field.append(inp);
      }
      const gb = el("button", { class: "chip", type: "button", "aria-pressed": String(gave), "aria-label": `D${q + 1} を思い出せない` }, "思い出せない");
      const renderGiveup = () => gb.setAttribute("aria-pressed", String(r.sel[i] === GIVEUP));
      if (!active) gb.disabled = true;
      else gb.onclick = () => { r.sel[i] = r.sel[i] === GIVEUP ? null : GIVEUP; pinned = logicalToday(); draftDrill(); renderDrill(); };
      field.append(gb);
      if (gave && !q0 && !active && spec.a !== undefined)       // 採点した後：答えを出す（紙に写して閉じる）
        field.append(el("p", { class: "fmt reveal" }, `答え：${answerText(spec)}（紙に写す）`));
      const mark = q0 || r.ok[i] === null || r.ok[i] === undefined ? "" : (r.ok[i] ? "○" : "×");
      row.append(el("span", { class: "qn" }, `D${q + 1}`), field, el("span", { class: "mark" }, mark));
      wrap.append(row);
    });
    if (active) {
      const f = el("div", { class: "dfoot" });
      const g = el("button", { class: "primary", type: "button" }, q0 ? "ドリルを送る" : (idx === 0 ? "採点する" : "直しを採点する"));
      g.onclick = gradeDrill;
      f.append(g, el("p", { class: "msg", id: "drillMsg" }));
      wrap.append(f);
    }
    box.append(wrap);
  });
}

/* ---------- 表示 ---------- */
function isSent(s){ return !!(s && s.submittedAt); }

function pickDefault(){
  const today = logicalToday();
  if (sets[today]) return today;
  const dates = Object.keys(sets).sort().reverse();
  // 今日の紙が無い日は：今日以前で未送信のもの（新しい順）→ なければ今日以前で最新 → それもなければ最新
  return dates.find(d => d <= today && !isSent(sets[d])) || dates.find(d => d <= today) || dates[0] || null;
}

/* 一覧が変わるたび（端末のキャッシュ→サーバーの順に2回来る）と、画面に戻ってきたときに呼ぶ。
   キャッシュの時点では今日の分がまだ無いことがあるので、本人が選んでいない限り毎回選び直す */
function applySets(next){
  sets = next;
  if (pinned !== logicalToday()) pinned = null;
  if (editing && cur && sets[cur]) { render(); return; }
  const d = pinned && cur && sets[cur] ? cur : pickDefault();
  if (d) openSet(d); else { cur = null; render(); }
}

function openSet(date){
  cur = date; editing = false;
  const s = sets[date], n = s.n;
  const draft = loadDraft(date, n);
  if (draft) { ans = draft.ans; unk = draft.unk; flg = draft.flg; hnt = draft.hnt || []; tStart = draft.tStart || ""; tEnd = draft.tEnd || ""; tRedo = draft.tRedo || ""; }
  else if (isSent(s)) { ans = (s.answers || []).slice(); unk = (s.unknown || []).slice(); flg = (s.flag || []).slice(); hnt = (s.hint || []).slice(); tStart = s.startTime || ""; tEnd = s.endTime || ""; tRedo = s.redoEndTime || ""; }
  else { ans = Array(n).fill(null); unk = Array(n).fill(false); flg = Array(n).fill(false); hnt = Array(n).fill(false); tStart = ""; tEnd = ""; tRedo = ""; }
  while (ans.length < n) ans.push(null);
  while (unk.length < n) unk.push(false);
  while (flg.length < n) flg.push(false);
  while (hnt.length < n) hnt.push(false);
  dst = loadDrill(date, s);
  render();
}

function renderList(){
  const list = $("list"), n = sets[cur].n, redo = sets[cur].redo || 0;
  list.replaceChildren();
  for (let i = 0; i < n; i++) {
    // 紙の問1〜redo は解き直しの節、その次から新しい問（紙の節と同じ区切り）
    if (redo && (i === 0 || i === redo)) list.append(el("p", { class: "hint", style: "margin:10px 0 2px;padding:0 14px" }, i === 0 ? "解き直し" : "新しい問"));
    const row = el("div", { class: "row" });
    const opts = el("div", { class: "opts" });
    CIRC.forEach((c, j) => {
      const b = el("button", { class: "opt", "aria-pressed": String(ans[i] === j + 1), "aria-label": `問${i + 1} の答え ${j + 1}` }, c);
      b.onclick = () => { ans[i] = ans[i] === j + 1 ? null : j + 1; if (ans[i]) unk[i] = false; saveDraft(); render(); };
      opts.append(b);
    });
    const extra = el("div", { class: "extra" });
    const u = el("button", { class: "chip", "aria-pressed": String(unk[i]) }, "わからない");
    u.onclick = () => { unk[i] = !unk[i]; if (unk[i]) { ans[i] = null; hnt[i] = false; } saveDraft(); render(); };
    // 紙の裏のヒントを見て解けた印。番号は別に押す。出題側が「まだ1人では解けていない」として類題で戻す
    const h = el("button", { class: "chip", "aria-pressed": String(hnt[i]) }, "ヒントで解けた");
    h.onclick = () => { hnt[i] = !hnt[i]; if (hnt[i]) unk[i] = false; saveDraft(); render(); };
    const f = el("button", { class: "chip flag", "aria-pressed": String(flg[i]) }, "変かも");
    f.onclick = () => { flg[i] = !flg[i]; saveDraft(); render(); };
    extra.append(u, h, f);
    row.append(el("span", { class: "qn" }, `問${i + 1}`), opts, extra);
    list.append(row);
  }
}

function renderDays(){
  const box = $("days"), dates = Object.keys(sets).sort().reverse().slice(0, 14);
  box.replaceChildren();
  for (const d of dates) {
    const s = sets[d];
    const b = el("button", { "aria-current": String(d === cur) });
    b.append(el("span", {}, `${shortLabel(d)} ${s.label || ""}`), el("span", { class: "st" }, isSent(s) ? "受け取り済み" : "未入力"));
    b.onclick = () => { $("daysBox").open = false; pinned = logicalToday(); openSet(d); window.scrollTo(0, 0); };
    const li = el("li"); li.append(b); box.append(li);
  }
  $("daysBox").hidden = dates.length < 2;
}

function render(){
  const has = cur && sets[cur];
  $("empty").hidden = !!has;
  $("main").hidden = !has;
  if (!has) { $("bar").hidden = true; $("daysBox").hidden = true; return; }
  const s = sets[cur], n = s.n;
  $("hDate").textContent = dateLabel(cur);
  $("hTitle").textContent = `${s.label || ""}　${n}問`;
  renderDrill();
  const showDone = isSent(s) && !editing;
  $("done").hidden = !showDone;
  $("entry").hidden = showDone;
  $("bar").hidden = showDone;
  if (showDone) {
    $("doneMsg").innerHTML = `${n}問ぶんの答えを記録しました。<br>このあとの20分は復習セッションです。`;
  } else {
    renderList();
    $("tStart").value = tStart; $("tEnd").value = tEnd; $("tRedo").value = tRedo;
    $("tRedoBox").hidden = !s.redo;
    const k = ans.filter(Boolean).length + unk.filter(Boolean).length;
    $("count").textContent = `${k} / ${n} 入力`;
    $("sendBtn").disabled = k === 0;
  }
  renderDays();
}

/* ---------- 送る ---------- */
async function send(){
  const s = sets[cur], n = s.n;
  const blank = ans.filter((a, i) => !a && !unk[i]).length;
  if (blank && !confirm(`入っていない問が ${blank} 問あります。このまま送りますか？（「わからない」と同じ扱いになります）`)) return;
  const nowD = new Date(), now = nowD.toISOString();
  const endT = tEnd || `${pad(nowD.getHours())}:${pad(nowD.getMinutes())}`;   // 終了が空なら送った時刻
  const patch = { answers: ans.slice(0, n), unknown: unk.slice(0, n), flag: flg.slice(0, n), hint: hnt.slice(0, n), startTime: tStart || null, endTime: endT, redoEndTime: (s.redo && tRedo) || null, submittedAt: now, updatedAt: now };
  if (!DEMO) {
    if (!uid) { toast("ログインしてください"); return; }
    try {
      await setDoc(doc(db, "users", uid, "gj", cur), patch, { merge: true });
    } catch (e) {
      // オフラインでもローカルに入り、復帰後に送られる（persistentLocalCache）。明確な拒否だけ知らせる
      if (e && e.code === "permission-denied") { toast("保存できませんでした（権限）"); return; }
    }
  }
  sets[cur] = { ...s, ...patch };
  dropDraft(cur);
  editing = false;
  render();
}

/* ---------- データ ---------- */
function startSync(){
  const q = query(collection(db, "users", uid, "gj"), orderBy("date", "desc"), limit(30));
  unsub = onSnapshot(q, snap => {
    const next = {};
    snap.forEach(d => { const v = d.data(); if (v && v.date && v.n) next[v.date] = v; });
    applySets(next);
  }, () => toast("読み込みに失敗しました"));
  setDoc(doc(db, "users", uid, "meta", "gj"), { app: "gijutsushi-pwa", lastSignIn: new Date().toISOString() }, { merge: true }).catch(() => {});
}
function stopSync(){ if (unsub) { unsub(); unsub = null; } }

function startDemo(){
  $("demoBanner").hidden = false;
  const t = logicalToday(), y = fmt(new Date(parse(t).getTime() - 86400000));
  const past = {
    [y]: { date: y, label: "適性", n: 6, answers: [2, null, 4, 1, 3, 5], unknown: [false, true, false, false, false, false], flag: Array(6).fill(false), submittedAt: "demo" }
  };
  // 本番と同じ順：まず端末のキャッシュ（今日の分がまだ無い）、少し遅れてサーバーから今日の分が届く
  applySets(past);
  const drill = { mode: "instant", minutes: 3, n: 5, qs: [{ t: "choice", n: 4, a: 2 }, { t: "short", a: ["等積", "定積"] }, { t: "choice", n: 2, a: 1 }, { t: "short", a: ["0.5", "1/2"] }, { t: "short", a: ["k-1"] }] };
  setTimeout(() => applySets({ ...past, [t]: { date: t, label: "専門・材料", n: 7, redo: 3, drill } }), 600);
}

/* ---------- 起動 ---------- */
$("sendBtn").onclick = send;
$("tStart").onchange = e => { tStart = e.target.value; saveDraft(); };
$("tEnd").onchange = e => { tEnd = e.target.value; saveDraft(); };
$("tRedo").onchange = e => { tRedo = e.target.value; saveDraft(); };
$("redoBtn").onclick = () => { editing = true; render(); };
// 「○×を出さない」（この端末だけ・押したその場で効く）。instant の日だけ出す
$("drillHide").onclick = () => { try { localStorage.setItem(hideKey, hideMarks() ? "0" : "1"); } catch (e) {} renderDrill(); };
// 開きっぱなしのアプリに翌日戻ってきたときも、今日の分に切り替える
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Object.keys(sets).length) applySets(sets); });

if (DEMO) {
  startDemo();
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  const provider = new GoogleAuthProvider();
  $("loginBtn").onclick = async () => {
    $("authMsg").textContent = "";
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      const code = (e && e.code) || "";
      if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment" || code === "auth/cancelled-popup-request") {
        try { await signInWithRedirect(auth, provider); } catch (e2) { $("authMsg").textContent = "ログイン失敗: " + (e2.code || e2.message); }
      } else if (code !== "auth/popup-closed-by-user") { $("authMsg").textContent = "ログイン失敗: " + (code || e.message); }
    }
  };
  $("logoutBtn").onclick = () => signOut(auth);
  getRedirectResult(auth).catch(() => {});
  onAuthStateChanged(auth, user => {
    if (user) { uid = user.uid; $("acct").textContent = user.email || "ログイン中"; $("logoutBtn").hidden = false; $("gate").hidden = true; startSync(); }
    else { uid = null; stopSync(); sets = {}; cur = null; render(); $("acct").textContent = ""; $("logoutBtn").hidden = true; $("gate").hidden = false; }
  });
}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
